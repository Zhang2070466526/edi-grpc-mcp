[project]
name = "edi-grpc-mcp"
version = "0.1.8"
description = "Local MCP server wrapping EDI gRPC and ANSYS HFSS tools for EDA engineering"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
keywords = ["mcp", "eda", "edi", "grpc", "ansys", "hfss", "electronic-design-automation"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Manufacturing",
    "License :: OSI Approved :: MIT License",
    "Operating System :: Microsoft :: Windows",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Electronic Design Automation (EDA)",
]
dependencies = [
    "grpcio>=1.82.1,<2",
    "httpx>=0.28",
    "matplotlib>=3.10",
    "mcp>=1.28.1,<2",
    "numpy>=2.0",
    "protobuf>=7.35.0,<8",
    "psutil>=7.2.2",
    "python-dotenv>=1.0.0",
    "pywin32>=306; platform_system == 'Windows'",
]

[project.scripts]
edi-grpc-mcp = "start_servers:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["proto", "servers", "start_servers.py"]

[tool.uv]
package = true

[dependency-groups]
dev = [
    "grpcio-tools>=1.82.1",
    "pyinstaller>=6.21.0",
    "pytest>=8.0",
    # 知识库依赖（可选）：chromadb, langchain, langchain-community, dashscope
]
