<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>EDI Chat</title>
<style>
:root {
    --bg: #16161e; --surface: #1a1b26; --overlay: #24283b; --muted: #565f89;
    --text: #c0caf5; --subtext: #9aa5ce; --blue: #7aa2f7; --green: #9ece6a;
    --red: #f7768e; --yellow: #e0af68; --purple: #bb9af7; --border: #2a2f47;
    --shadow: rgba(0,0,0,.35); --radius: 10px; --radius-sm: 6px;
    --panel-w: 300px; --panel-narrow: 44px;
}
@media (prefers-color-scheme: light) {
:root {
    --bg: #f4f5f8; --surface: #eceef2; --overlay: #dfe2ea; --muted: #9ca0b0;
    --text: #3c3f50; --subtext: #5c5f77; --blue: #1e66f5; --green: #40a02b;
    --red: #d20f39; --yellow: #df8e1d; --purple: #8839ef; --border: #cbd0dc;
    --shadow: rgba(0,0,0,.08);
}}
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%}
body{font-family:system-ui,-apple-system,"Segoe UI",sans-serif;background:var(--bg);color:var(--text);display:flex;height:100vh;overflow:hidden;font-size:14px}

/* ===== Sidebar ===== */
.panel{width:var(--panel-w);background:var(--surface);border-right:1px solid var(--border);display:flex;flex-direction:column;overflow:hidden;transition:width .25s ease;flex-shrink:0}
.panel-inner{display:flex;flex-direction:column;flex:1;min-height:0;overflow:hidden}
.panel.narrow{width:var(--panel-narrow)}
.panel.narrow .panel-inner{display:none}
.panel.narrow .panel-expand{display:flex}
.panel-expand{display:none;flex-direction:column;align-items:center;padding-top:14px;gap:8px}
.panel-expand button{background:none;border:none;color:var(--muted);cursor:pointer;font-size:16px;padding:6px;border-radius:var(--radius-sm)}
.panel-expand button:hover{color:var(--text);background:var(--overlay)}
.panel-head{padding:14px 14px 10px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between}
.panel-head h2{font-size:13px;font-weight:600;color:var(--subtext);letter-spacing:.3px}
.panel-head button{background:none;border:none;color:var(--muted);cursor:pointer;font-size:15px;padding:2px 6px;border-radius:var(--radius-sm);transition:color .2s,background .2s}
.panel-head button:hover{color:var(--text);background:var(--overlay)}
.tool-search{position:relative;padding:10px 12px 6px}
.tool-search input{width:100%;background:var(--bg);border:1px solid var(--border);border-radius:var(--radius-sm);padding:7px 10px 7px 30px;font-size:13px;color:var(--text);outline:none;transition:border-color .2s}
.tool-search input:focus{border-color:var(--blue)}
.tool-search .search-ico{position:absolute;left:22px;top:16px;font-size:13px;color:var(--muted);pointer-events:none}
.tools-list{flex:1;overflow-y:auto;padding:2px 10px 12px;scrollbar-width:thin;scrollbar-color:var(--overlay) transparent}
.tools-list::-webkit-scrollbar{width:6px}
.tools-list::-webkit-scrollbar-thumb{background:var(--overlay);border-radius:3px}
.cat-label{font-size:11px;color:var(--muted);font-weight:600;padding:14px 8px 4px;cursor:pointer;user-select:none;display:flex;align-items:center;gap:5px;letter-spacing:.4px;text-transform:uppercase}
.cat-label:hover{color:var(--text)}
.cat-label .arrow{font-size:8px;transition:transform .2s}
.cat-label.folded .arrow{transform:rotate(-90deg)}
.cat-items.folded{display:none}
.tool-item{display:flex;flex-direction:column;padding:6px 9px;border-radius:var(--radius-sm);cursor:default;position:relative;margin-bottom:1px;transition:background .15s}
.tool-item:hover{background:var(--overlay)}
.tool-item .tn-top{display:flex;align-items:center;gap:7px}
.tool-item .dot{width:6px;height:6px;border-radius:50%;flex-shrink:0;background:var(--muted)}
.dot.on{background:var(--green)}.dot.off{background:var(--red)}.dot.file{background:var(--blue)}
.tool-item .zh{font-size:13px;font-weight:500;color:var(--text);line-height:1.35}
.tool-item .en{font-size:10.5px;color:var(--muted);font-family:ui-monospace,Menlo,Consolas,monospace}
.tool-tip{display:none;position:fixed;z-index:100;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-sm);padding:9px 11px;font-size:11px;max-width:300px;box-shadow:0 8px 24px var(--shadow);pointer-events:none}
.tool-tip .tip-zh{color:var(--text);font-weight:600;font-size:13px;margin-bottom:3px}
.tool-tip .tip-desc{color:var(--subtext);font-size:11.5px;line-height:1.45}

/* ===== Main ===== */
.main{flex:1;display:flex;flex-direction:column;overflow:hidden;min-width:0;background:var(--bg)}
.top{background:var(--surface);padding:10px 18px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:12px;flex-shrink:0}
.hamburger{background:none;border:none;color:var(--text);cursor:pointer;font-size:18px;padding:4px 6px;border-radius:var(--radius-sm)}
.hamburger:hover{background:var(--overlay)}
.top .logo{width:32px;height:32px;border-radius:8px;background:linear-gradient(135deg,var(--blue),var(--purple));display:flex;align-items:center;justify-content:center;font-size:15px;font-weight:700;color:#fff;flex-shrink:0}
.top .titles{display:flex;flex-direction:column;line-height:1.2}
.top .title{font-size:14px;font-weight:600}
.top .subtitle{font-size:10.5px;color:var(--muted)}
.top .context-bar{margin-left:auto;display:flex;align-items:center;gap:12px;font-size:11.5px;color:var(--subtext)}
.ctx-dot{width:8px;height:8px;border-radius:50%;background:var(--muted);flex-shrink:0}
.ctx-dot.on{background:var(--green);box-shadow:0 0 0 3px rgba(158,206,106,.18)}
.ctx-dot.off{background:var(--red);box-shadow:0 0 0 3px rgba(247,118,142,.18)}
.ctx-inline{display:flex;align-items:center;gap:6px}
.btn-new{background:var(--overlay);border:1px solid var(--border);color:var(--text);font-size:11.5px;padding:5px 12px;border-radius:var(--radius-sm);cursor:pointer;transition:background .15s,color .15s}
.btn-new:hover{background:var(--blue);border-color:var(--blue);color:#fff}

/* ===== Messages ===== */
.msgs{flex:1;overflow-y:auto;padding:20px 22px;display:flex;flex-direction:column;gap:16px;scroll-behavior:smooth;scrollbar-width:thin;scrollbar-color:var(--overlay) transparent}
.msgs::-webkit-scrollbar{width:6px}
.msgs::-webkit-scrollbar-thumb{background:var(--overlay);border-radius:3px}
.msg{display:flex;gap:10px;max-width:82%;animation:in .22s ease-out}
@keyframes in{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
.msg.user{align-self:flex-end;flex-direction:row-reverse}
.msg.assistant{align-self:flex-start}
.msg .avatar{width:30px;height:30px;border-radius:8px;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;margin-top:1px}
.msg.user .avatar{background:var(--blue);color:#fff}
.msg.assistant .avatar{background:var(--overlay);color:var(--blue)}
.msg-body{display:flex;flex-direction:column;gap:3px;min-width:0}
.msg.user .msg-body{align-items:flex-end}
.msg.assistant .msg-body{align-items:flex-start}
.bubble{padding:10px 14px;border-radius:12px;font-size:13.5px;line-height:1.55;white-space:pre-wrap;word-break:break-word;overflow-wrap:break-word}
.msg.user .bubble{background:var(--blue);color:#fff;border-bottom-right-radius:4px}
.msg.assistant .bubble{background:var(--surface);border:1px solid var(--border);border-bottom-left-radius:4px}
.msg-time{font-size:10px;color:var(--muted);padding:0 4px}

/* ===== Image cards ===== */
.img-card{background:var(--surface);border:1px solid var(--border);border-radius:12px;overflow:hidden;max-width:720px}
.img-wrap img{display:block;width:100%;max-height:60vh;object-fit:contain;cursor:pointer;background:var(--bg)}
.img-wrap img.full{max-height:none;position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);z-index:999;max-width:95vw;max-height:95vh;box-shadow:0 0 60px rgba(0,0,0,.65);border-radius:6px}
.img-actions{display:flex;justify-content:space-between;align-items:center;padding:7px 12px;font-size:11px;color:var(--muted)}
.img-actions a{color:var(--blue);text-decoration:none}
.img-actions a:hover{text-decoration:underline}

/* ===== Activities ===== */
.activities{margin-top:6px}
.activity{font-size:11px;border-radius:var(--radius-sm);background:var(--bg);border:1px solid var(--border);margin-bottom:5px;overflow:hidden}
.activity-header{display:flex;align-items:center;gap:7px;padding:6px 12px;cursor:pointer;user-select:none}
.activity-header:hover{background:var(--overlay)}
.activity-header .status-icon{font-size:12px}
.status-icon.ok{color:var(--green)}.status-icon.err{color:var(--red)}
.activity-header .tool-label{flex:1;font-weight:500}
.activity-header .duration{color:var(--muted);font-size:10px}
.activity-header .expand{color:var(--muted);font-size:10px;transition:transform .2s}
.activity-body{display:none;padding:8px 12px 12px 30px;border-top:1px solid var(--border)}
.activity-body.open{display:block}
.activity-body pre{background:var(--surface);padding:7px 9px;border-radius:6px;overflow-x:auto;font-size:10.5px;margin:4px 0;border:1px solid var(--border);max-height:140px}
.activity-body .label{font-size:10px;color:var(--muted);margin-top:6px}
.activity-body .error-text{color:var(--red);font-size:10.5px}

/* ===== Typing ===== */
.typing{display:flex;gap:4px;padding:6px 0;align-self:flex-start}
.typing span{width:6px;height:6px;background:var(--muted);border-radius:50%;animation:wave 1.4s infinite}
.typing span:nth-child(2){animation-delay:.2s}
.typing span:nth-child(3){animation-delay:.4s}
@keyframes wave{0%,60%,100%{opacity:.3}30%{opacity:1}}

/* ===== Input ===== */
.input-wrap{padding:12px 22px 18px;background:var(--surface);border-top:1px solid var(--border);flex-shrink:0}
.input-row{display:flex;flex-direction:column;background:var(--bg);border:1px solid var(--border);border-radius:12px;padding:8px 10px 6px;transition:border-color .2s,box-shadow .2s}
.input-row:focus-within{border-color:var(--blue);box-shadow:0 0 0 3px rgba(122,162,247,.12)}
.input-row textarea{flex:1;background:none;border:none;color:var(--text);font-size:13.5px;font-family:inherit;resize:none;outline:none;padding:6px 8px;min-height:64px;max-height:200px;line-height:1.5}
.input-foot{display:flex;align-items:center;justify-content:space-between;padding:4px 8px 4px}
.input-hint{font-size:10.5px;color:var(--muted);display:flex;align-items:center;gap:8px}
.input-hint kbd{background:var(--overlay);border:1px solid var(--border);border-radius:4px;padding:1px 5px;font-family:inherit;font-size:9.5px}
#sendBtn{background:var(--blue);color:#fff;border:none;border-radius:8px;padding:6px 22px;cursor:pointer;font-size:13px;font-weight:600;align-self:flex-end;transition:opacity .15s}
#sendBtn:hover{opacity:.88}
#sendBtn:disabled{opacity:.45;cursor:not-allowed}
#sendBtn.stop{background:var(--red)}
#uploadBtn{background:none;border:none;color:var(--muted);cursor:pointer;font-size:17px;padding:4px 8px;transition:color .15s,background .15s;border-radius:6px;display:flex}
#uploadBtn:hover{color:var(--blue);background:var(--overlay)}
#attachBar{display:none;align-items:center;gap:10px;padding:6px 8px 2px}
#attachPreview{width:44px;height:44px;border-radius:8px;object-fit:cover;border:1px solid var(--border);background:var(--overlay)}
#attachInfo{flex:1;min-width:0}
#attachName{font-size:12px;font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#attachSize{font-size:10px;color:var(--muted)}
#attachRemove{background:none;border:none;color:var(--muted);cursor:pointer;font-size:14px;padding:3px 7px;border-radius:6px}
#attachRemove:hover{color:var(--red);background:var(--overlay)}
</style>
</head>
<body>

<!-- Sidebar -->
<div class="panel" id="panel">
    <div class="panel-inner">
        <div class="panel-head">
            <h2>工具 · Tools</h2>
            <button onclick="foldPanel()" title="折叠侧栏">&laquo;</button>
        </div>
        <div class="tool-search">
            <span class="search-ico">&#128269;</span>
            <input type="text" id="toolSearch" placeholder="搜索工具..." oninput="renderTools()">
        </div>
        <div class="tools-list" id="toolsList"></div>
    </div>
    <div class="panel-expand" id="panelExpand">
        <button onclick="unfoldPanel()" title="展开侧栏">&raquo;</button>
    </div>
</div>

<!-- Main -->
<div class="main">
    <div class="top">
        <button class="hamburger" onclick="togglePanel()">&#9776;</button>
        <div class="logo">E</div>
        <div class="titles">
            <div class="title">EDI Chat</div>
            <div class="subtitle">EDI 工程智能助手</div>
        </div>
        <div class="context-bar">
            <span class="ctx-inline">
                <span id="ctxDot" class="ctx-dot off"></span>
                <span id="ctxStatus"></span>
            </span>
            <button class="btn-new" onclick="newSession()" title="开始新对话">+ 新对话</button>
        </div>
    </div>
    <div class="msgs" id="msgs">
        <div class="msg assistant">
            <div class="avatar">AI</div>
            <div class="msg-body">
                <div class="bubble">你好！我可以帮你操作 EDI 工程。<br>试试：打开工程 / 查看元件 / 工程概览 / 执行仿真</div>
                <div class="msg-time"></div>
            </div>
        </div>
    </div>
    <div class="input-wrap">
        <div class="input-row">
            <div id="attachBar">
                <img id="attachPreview" src="" alt="">
                <div id="attachInfo">
                    <div id="attachName"></div>
                    <div id="attachSize"></div>
                </div>
                <button id="attachRemove" onclick="clearFile()" title="移除">✕</button>
            </div>
            <textarea id="q" rows="3" placeholder="输入消息，支持粘贴图片、拖拽文件&#10;Enter 发送 · Shift+Enter 换行"
                onkeydown="if(event.key==='Enter'&&!event.shiftKey){event.preventDefault();send()}"></textarea>
            <div class="input-foot">
                <span class="input-hint">
                  <input type="file" id="fileInput" style="display:none" accept="image/*,.pdf,.docx,.csv,.txt,.log" onchange="onFilePicked()">
                  <button id="uploadBtn" onclick="document.getElementById('fileInput').click()" title="添加图片或文件">📎</button>
                  <span><kbd>Enter</kbd> 发送 · <kbd>Shift</kbd>+<kbd>Enter</kbd> 换行</span>
                </span>
                <button id="sendBtn" onclick="send()">发送</button>
            </div>
        </div>
    </div>
</div>

<!-- Tooltip -->
<div class="tool-tip" id="tooltip"></div>

<script>
// 从 URL query 提取 token（鉴权启用时 /ui 访问会带 ?token=，页面内 fetch 也需带上）
const AUTH_TOKEN = new URLSearchParams(location.search).get("token") || "";
function withToken(path) {
    return location.origin + path + (AUTH_TOKEN ? "?token=" + encodeURIComponent(AUTH_TOKEN) : "");
}
const CHAT_URL = withToken("/chat");
const HLTH_URL = location.origin + "/health";
const TOOLS_URL = withToken("/tools/list");

let tools = [], edaReady = false, tcReady = false;

// Tool name mappings
const TOOL_ZH = {
    list_epp_projects:"扫描工程",open_edi_project:"打开工程",close_edi_project:"关闭工程",analyze_variables:"分析变量",
    list_simulation_components:"列出元件",list_schematic_components:"实时器件列表",get_schematic_component_info:"查器件详情",get_project_summary:"工程概览",
    simulate_project:"执行仿真(同步)",start_simulation_async:"启动异步仿真",get_simulation_async_status:"查询仿真状态",
    get_simulation_async_result:"获取仿真结果",simulate_netlist:"仿真网表",simulate_netlist_with_ads:"ADS仿真控制器",
    export_project_netlist:"导出网表",capture_schematic:"截图原理图",replace_models_from_csv:"批量替换模型",
    launch_edi:"启动EDI",get_service_status:"服务状态",compare_simulation_results:"对比仿真结果",turbocharts_convert:"RAW转曲线图",
    show_image:"显示图片",open_hfss_project:"打开HFSS",close_hfss_project:"关闭HFSS",launch_aedt:"启动AEDT",
    get_hfss_project_info:"HFSS信息",start_hfss_analysis_async:"HFSS异步仿真",get_hfss_analysis_status:"HFSS仿真状态",
    list_eda_tasks:"仿真任务列表",list_result_curves:"RAW曲线列表",analyze_image:"分析图片",
    create_simulation_component:"创建仿真器件",update_simulation_component:"更新仿真器件",
    delete_simulation_component:"删除器件",set_component_active_state:"设置器件状态",
    get_simulation_component_schema:"控件参数",generate_schematic_from_netlist:"网表生成原理图",attach_out_component:"挂载Out器件",replace_schematic_from_file:"替换原理图",generate_simulation_report:"生成仿真报告",
    cst_solve_async:"CST求解",cst_solve_query:"CST求解查询",cst_export_snp:"CST导出S参数",cst_export_farfield:"CST导出远场方向图",cst_export_farfield_query:"CST导出远场查询",
    open_document:"打开文档",get_components_static_params:"器件固有参数",
};

// Session
let sessionId = localStorage.getItem("eda_chat_session_id");
if (!sessionId) { sessionId = crypto.randomUUID(); localStorage.setItem("eda_chat_session_id", sessionId); }

function newSession() {
    sessionId = crypto.randomUUID(); localStorage.setItem("eda_chat_session_id", sessionId);
    document.getElementById("msgs").innerHTML = '';
    addMsg("assistant", "新对话已开始。当前工程等信息已清空。");
    updateContext({});
}

function updateContext(ctx) {
    let online = edaReady;
    let dot = document.getElementById("ctxDot");
    dot.className = "ctx-dot " + (online ? "on" : "off");
    let parts = [];
    parts.push(online ? "EDI 在线" : "EDI 离线");
    parts.push(ctx && ctx.current_project_name ? "工程：" + ctx.current_project_name : "未选择工程");
    document.getElementById("ctxStatus").textContent = parts.join(" · ");
}

// Sidebar
function foldPanel() { setPanelState("narrow"); }
function unfoldPanel() { setPanelState("open"); }
function togglePanel() { setPanelState(document.getElementById("panel").classList.contains("narrow") ? "open" : "narrow"); }
function setPanelState(state) {
    let p = document.getElementById("panel");
    p.classList.toggle("narrow", state === "narrow");
    localStorage.setItem("eda_panel_state", state);
}
(function() { if (localStorage.getItem("eda_panel_state") === "narrow") setPanelState("narrow"); })();

// Tool panel
let foldedCats = JSON.parse(localStorage.getItem("eda_folded_cats") || "[]");

function catFor(name) {
    if (["list_epp_projects","open_edi_project","close_edi_project","get_project_summary","analyze_variables"].includes(name)) return "工程";
    if (["list_schematic_components","get_schematic_component_info","list_simulation_components","get_simulation_component_schema"].includes(name)) return "器件查询";
    if (["create_simulation_component","update_simulation_component","delete_simulation_component","set_component_active_state","generate_schematic_from_netlist","replace_port_component","attach_out_component","replace_schematic_from_file"].includes(name)) return "器件管理";
    if (["simulate_project","start_simulation_async","get_simulation_async_status","get_simulation_async_result","list_eda_tasks","simulate_netlist","simulate_netlist_with_ads"].includes(name)) return "仿真";
    if (["export_project_netlist","capture_schematic","list_result_curves"].includes(name)) return "分析导出";
    if (["turbocharts_convert","compare_simulation_results"].includes(name)) return "图表";
    if (["replace_models_from_csv","get_components_static_params"].includes(name)) return "模型";
    if (["launch_edi","get_service_status"].includes(name)) return "启动诊断";
    if (["show_image","analyze_image","open_document"].includes(name)) return "图片文档";
    if (name.includes("hfss") || name.includes("aedt")) return "ANSYS HFSS";
    if (name.startsWith("cst_")) return "CST 电磁";
    if (["generate_simulation_report"].includes(name)) return "报告";
    return "其他";
}

async function loadTools() {
    try { let r = await fetch(TOOLS_URL); let d = await r.json(); tools = Array.isArray(d) ? d : (d.result?.tools || []); } catch(e) {}
    renderTools();
}

function renderTools() {
    let q = (document.getElementById("toolSearch").value || "").toLowerCase();
    let h = {};
    for (let t of tools) {
        let c = catFor(t.name);
        if (q && !TOOL_ZH[t.name]?.includes(q) && !t.name.includes(q) && !t.description?.includes(q)) continue;
        if (!h[c]) h[c] = []; h[c].push(t);
    }
    let el = document.getElementById("toolsList"), html = "";
    for (let cat of Object.keys(h).sort()) {
        let isFolded = foldedCats.includes(cat);
        html += '<div class="cat-label'+(isFolded?' folded':'')+'" onclick="toggleCat(this,\''+cat+'\')"><span class="arrow">&#9660;</span>'+cat+'</div>';
        html += '<div class="cat-items'+(isFolded?' folded':'')+'">';
        for (let t of h[cat]) {
            let zh = TOOL_ZH[t.name] || t.name;
            let cls = edaReady || tcReady ? "on" : "off";
            if (t.name.startsWith("list_") || t.name.startsWith("get_")) cls = "file";
            html += '<div class="tool-item" data-name="'+t.name.replace(/"/g,'&quot;')+'" data-desc="'+(t.description||'').replace(/"/g,'&quot;')+'" data-zh="'+zh.replace(/"/g,'&quot;')+'" onmouseenter="showTip(event,this)" onmouseleave="hideTip()">';
            html += '<div class="tn-top"><span class="dot '+cls+'"></span><span class="zh">'+zh+'</span></div>';
            html += '<span class="en">'+t.name+'</span></div>';
        }
        html += '</div>';
    }
    el.innerHTML = html;
}

function toggleCat(el, cat) {
    if (foldedCats.includes(cat)) foldedCats = foldedCats.filter(c => c !== cat);
    else foldedCats.push(cat);
    localStorage.setItem("eda_folded_cats", JSON.stringify(foldedCats));
    renderTools();
}

function showTip(e, el) {
    let tip = document.getElementById("tooltip");
    tip.innerHTML = '<div class="tip-zh">'+el.dataset.zh+'</div><div class="tip-desc">'+el.dataset.desc+'</div>';
    tip.style.display = "block";
    let r = tip.getBoundingClientRect();
    let x = e.clientX + 12, y = e.clientY - 10;
    if (x + r.width > window.innerWidth) x = e.clientX - r.width - 12;
    if (y + r.height > window.innerHeight) y = e.clientY - r.height - 10;
    tip.style.left = x + "px"; tip.style.top = y + "px";
}
function hideTip() { document.getElementById("tooltip").style.display = "none"; }

async function checkHealth() {
    try { let r = await fetch(HLTH_URL), d = await r.json(); edaReady = d.eda_grpc_ready; tcReady = d.turbocharts_ready; } catch(e) {}
    renderTools();
}

// Chat
function nowTime() {
    let d = new Date();
    return ("0"+d.getHours()).slice(-2) + ":" + ("0"+d.getMinutes()).slice(-2);
}
function addMsg(role, text) {
    let div = document.createElement("div"), av = document.createElement("div"), body = document.createElement("div");
    let bub = document.createElement("div"), tm = document.createElement("div");
    div.className = "msg "+role; av.className = "avatar"; av.textContent = role==="user"?"U":"AI";
    body.className = "msg-body"; bub.className = "bubble"; tm.className = "msg-time";
    bub.textContent = text; tm.textContent = nowTime();
    body.append(bub, tm); div.append(av, body);
    document.getElementById("msgs").appendChild(div); scrollDown(); return div;
}
function renderMedia(mediaList) {
    if (!mediaList || !mediaList.length) return;
    let msgs = document.getElementById("msgs");
    for (let m of mediaList) {
        if (m.type === "image" && m.url) {
            let div = document.createElement("div"), av = document.createElement("div"), card = document.createElement("div");
            div.className = "msg assistant"; av.className = "avatar"; av.textContent = "AI";
            card.className = "img-card";
            card.innerHTML = '<div class="img-wrap"><img src="' + m.url.replace(/&/g,'&amp;') + '" alt="' + (m.name||'image').replace(/"/g,'&quot;') + '" loading="lazy" onclick="this.classList.toggle(\'full\')"></div><div class="img-actions"><span>' + (m.name||'') + '</span><a href="' + m.url.replace(/&/g,'&amp;') + '" target="_blank">新窗口</a></div>';
            div.append(av, card); msgs.appendChild(div);
        }
    }
    scrollDown();
}

function stripMediaLine(text) {
    return text.split("\n").filter(l => !l.startsWith("MEDIA:")).join("\n").trim();
}

function addActivityBubble(activities) {
    let div = document.createElement("div"), av = document.createElement("div"), wrap = document.createElement("div");
    div.className = "msg assistant"; av.className = "avatar"; av.textContent = "AI";
    wrap.className = "bubble"; wrap.style.fontSize = "11px";
    let hdr = document.createElement("div"); hdr.textContent = "工具执行详情："; hdr.style.cssText = "margin-bottom:4px;color:var(--subtext)";
    wrap.appendChild(hdr);
    let list = document.createElement("div"); list.className = "activities";
    for (let a of activities) {
        let item = document.createElement("div"); item.className = "activity";
        let h = document.createElement("div"); h.className = "activity-header";
        let ok = a.status === "success";
        h.innerHTML = '<span class="status-icon '+(ok?'ok':'err')+'">'+(ok?'&#10003;':'&#10007;')+'</span><span class="tool-label">'+(a.label||a.tool)+'</span>'+(a.duration_ms?'<span class="duration">'+a.duration_ms+'ms</span>':'')+'<span class="expand">&#9660;</span>';
        let b = document.createElement("div"); b.className = "activity-body";
        let bh = '';
        if (a.tool) bh += '<div class="label">工具</div><div>'+a.tool.replace(/&/g,'&amp;').replace(/</g,'&lt;')+'</div>';
        if (a.args&&Object.keys(a.args).length) bh += '<div class="label">参数</div><pre>'+JSON.stringify(a.args,null,2).replace(/&/g,'&amp;').replace(/</g,'&lt;')+'</pre>';
        if (a.summary) bh += '<div class="label">摘要</div><div>'+a.summary.replace(/&/g,'&amp;').replace(/</g,'&lt;')+'</div>';
        if (a.error) bh += '<div class="label">错误</div><div class="error-text">'+a.error.replace(/&/g,'&amp;').replace(/</g,'&lt;')+'</div>';
        b.innerHTML = bh;
        h.onclick = function() { b.classList.toggle("open"); h.querySelector(".expand").textContent = b.classList.contains("open")?"▲":"▼"; };
        item.append(h, b); list.appendChild(item);
    }
    wrap.appendChild(list); div.append(av, wrap);
    document.getElementById("msgs").appendChild(div); scrollDown();
}
function scrollDown() { let m = document.getElementById("msgs"); m.scrollTo({top:m.scrollHeight,behavior:"smooth"}); }
function showTyping() {
    let d = document.createElement("div"); d.className = "typing"; d.id = "typing";
    for (let i = 0; i < 3; i++) { let s = document.createElement("span"); d.appendChild(s) }
    document.getElementById("msgs").appendChild(d); scrollDown();
}
function hideTyping() { document.getElementById("typing")?.remove(); }

// File upload — 支持点击、拖拽、粘贴
let pickedFile = null;

function onFilePicked() {
    let f = document.getElementById("fileInput").files[0];
    if (!f) return;
    setPickedFile(f);
}

function setPickedFile(file) {
    pickedFile = file;
    let bar = document.getElementById("attachBar");
    bar.style.display = "flex";
    document.getElementById("attachName").textContent = file.name;
    let size = file.size > 1024*1024 ? (file.size/1024/1024).toFixed(1)+" MB" : (file.size/1024).toFixed(0)+" KB";
    document.getElementById("attachSize").textContent = size;
    let preview = document.getElementById("attachPreview");
    if (file.type.startsWith("image/")) {
        let reader = new FileReader();
        reader.onload = function(e) { preview.src = e.target.result; };
        reader.readAsDataURL(file);
        preview.style.display = "block";
    } else {
        preview.style.display = "none";
    }
}

function clearFile() {
    pickedFile = null;
    document.getElementById("fileInput").value = "";
    document.getElementById("attachBar").style.display = "none";
    document.getElementById("attachPreview").src = "";
}

document.getElementById("q").addEventListener("paste", function(e) {
    let items = e.clipboardData?.items;
    if (!items) return;
    for (let item of items) {
        if (item.type.startsWith("image/")) {
            e.preventDefault();
            let blob = item.getAsFile();
            setPickedFile(new File([blob], "clipboard_" + Date.now() + ".png", {type: blob.type}));
            return;
        }
    }
});

let inputWrap = document.querySelector(".input-wrap");
inputWrap.addEventListener("dragover", function(e) { e.preventDefault(); });
inputWrap.addEventListener("drop", function(e) {
    e.preventDefault();
    let files = e.dataTransfer?.files;
    if (files && files.length > 0) {
        setPickedFile(files[0]);
    }
});

async function send() {
    let q = document.getElementById("q"), m = q.value.trim();
    let file = pickedFile;
    if (!m && !file) return;

    let filePath = null;
    if (file) {
        showTyping();
        try {
            let fd = new FormData();
            fd.append("file", file);
            let r = await fetch(withToken("/upload"), {method:"POST",body:fd});
            let d = await r.json();
            hideTyping();
            if (d.success) {
                filePath = d.file_path;
                if (file.type.startsWith("image/")) {
                    m = m ? m + "\n\n请使用 analyze_image 分析这张图片: " + d.file_path : "请使用 analyze_image 分析图片: " + d.file_path;
                } else {
                    m = m ? m + "\n\n请使用 open_document 查看这个文件: " + d.file_path : "请查看文件: " + d.file_path;
                }
            } else {
                addMsg("assistant", "文件上传失败: " + (d.error || "未知错误"));
            }
        } catch (e) {
            addMsg("assistant", "文件上传失败: " + e.message);
        }
        hideTyping();
    }

    q.value = ""; q.style.height = "auto";
    clearFile();
    if (!m) return;
    addMsg("user", m);
    showTyping();
    let btn = document.getElementById("sendBtn");
    btn.disabled = true; btn.classList.add("stop"); btn.textContent = "停止";
    try {
        let r = await fetch(CHAT_URL, {method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({session_id:sessionId,message:m})});
        let d = await r.json();
        hideTyping();
        // 后端在 session 失效（服务重启/过期）时会自动创建新 session 并返回新 id，这里同步更新，保证多轮对话上下文连续
        if (d.session_id && d.session_id !== sessionId) {
            sessionId = d.session_id;
            localStorage.setItem("eda_chat_session_id", sessionId);
        }
        if (d.activities && d.activities.length) addActivityBubble(d.activities);
        renderMedia(d.media);
        updateContext(d.context || {});
        if (d.reply) addMsg("assistant", stripMediaLine(d.reply));
        else if (d.error) addMsg("assistant", "错误: " + d.error);
        else addMsg("assistant", "已完成。");
    } catch (e) { hideTyping(); addMsg("assistant", "请求失败: " + e.message); }
    btn.disabled = false; btn.classList.remove("stop"); btn.textContent = "发送";
}

// Init
document.getElementById("q").addEventListener("input", function() { this.style.height = "auto"; this.style.height = Math.min(this.scrollHeight, 200) + "px"; });
loadTools(); checkHealth(); setInterval(checkHealth, 30000);
</script>
